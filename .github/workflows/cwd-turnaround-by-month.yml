name: Generate CWD Turnaround by Month

on:
  workflow_dispatch:

jobs:
  cwd-turnaround-by-month:
    runs-on: ubuntu-latest

    env:
      PYTHONDONTWRITEBYTECODE: "1"

      # ---------------------------------------------------------------
      # Object Storage credentials
      # ---------------------------------------------------------------
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_CWD_ACCESS_KEY: ${{ secrets.S3_CWD_ACCESS_KEY }}
      S3_CWD_SECRET_KEY: ${{ secrets.S3_CWD_SECRET_KEY }}

      # ---------------------------------------------------------------
      # Input generated by the CWD public-reporting pipeline
      # ---------------------------------------------------------------
      S3_INPUT_BUCKET: "whcwdp"
      S3_INPUT_KEY: "CWD_Reporting_Staging/cwd_public_reporting.xlsx"
      SHEET_NAME: "0"

      # ---------------------------------------------------------------
      # Output
      # The existing public HTML files are currently in whcwdpbcbox.
      # ---------------------------------------------------------------
      S3_OUTPUT_BUCKET: "whcwdpbcbox"
      S3_HTML_OUTPUT_KEY: "cwd_turnaround_by_month.html"

      # ---------------------------------------------------------------
      # Chart configuration
      # ---------------------------------------------------------------
      DATE_FIELD: "SAMPLED_DATE"
      TURNAROUND_FIELD: "DAYS_TO_TEST_STATUS"
      IQR_MULTIPLIER: "1.5"
      CHART_START_DATE: "2023-04-01"
      REPORTING_TIMEZONE: "America/Vancouver"
      INCLUDE_PLOTLYJS: "cdn"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Restore pip cache
        id: pip-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python39-pip-${{ hashFiles('requirements.txt') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Save pip cache
        if: steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}

      - name: Generate CWD turnaround-by-month output
        run: python scripts/cwd_turnaround_by_month.py

      - name: Verify S3 output
        run: |
          python - <<'PY'
          import os

          import boto3
          from botocore.config import Config

          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["S3_ENDPOINT"],
              aws_access_key_id=os.environ["S3_CWD_ACCESS_KEY"],
              aws_secret_access_key=os.environ["S3_CWD_SECRET_KEY"],
              config=Config(
                  retries={
                      "max_attempts": 5,
                      "mode": "standard",
                  }
              ),
          )

          bucket = os.environ["S3_OUTPUT_BUCKET"]
          key = os.environ["S3_HTML_OUTPUT_KEY"]

          response = s3.head_object(Bucket=bucket, Key=key)
          size = response["ContentLength"]

          if size <= 0:
              raise RuntimeError(f"Output object is empty: s3://{bucket}/{key}")

          print(f"Found s3://{bucket}/{key} ({size:,} bytes)")
          PY

      - name: Verify repository remained clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected files or modifications were created in the repository:"
            git status --short
            exit 1
          fi

          echo "Repository is clean."
