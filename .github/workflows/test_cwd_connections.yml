name: Test CWD Connections

on:
  workflow_dispatch:

jobs:
  test-connections:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Restore pip cache
        id: pip-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python39-pip-${{ hashFiles('requirements.txt') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Save immediately after successful dependency installation.
      # This still happens even if the connection test later fails.
      - name: Save pip cache
        if: steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}

      - name: Test connections
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_CWD_ACCESS_KEY: ${{ secrets.S3_CWD_ACCESS_KEY }}
          S3_CWD_SECRET_KEY: ${{ secrets.S3_CWD_SECRET_KEY }}

          AGO_HOST: ${{ secrets.AGO_HOST }}
          AGO_USERNAME: ${{ secrets.AGO_USERNAME }}
          AGO_PASSWORD: ${{ secrets.AGO_PASSWORD }}

        run: python scripts/test_connections.py
