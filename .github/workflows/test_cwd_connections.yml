name: Test CWD Connections

on:
  workflow_dispatch:

jobs:
  test-connections:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Test connections
        env:
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_CWD_ACCESS_KEY: ${{ secrets.S3_CWD_ACCESS_KEY }}
          S3_CWD_SECRET_KEY: ${{ secrets.S3_CWD_SECRET_KEY }}

          AGO_HOST: ${{ vars.AGO_HOST }}
          AGO_USERNAME: ${{ secrets.AGO_USERNAME }}
          AGO_PASSWORD: ${{ secrets.AGO_PASSWORD }}

        run: python scripts/test_connections.py
