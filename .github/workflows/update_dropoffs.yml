name: Manual Trigger of Dropoff Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-scripts:
    # Prevent the workflow from running in forks
    if: github.repository == 'bcgov/nr-wildlife-health-cwd'
    runs-on: ubuntu-latest

    env:
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_CWD_ACCESS_KEY: ${{ secrets.S3_CWD_ACCESS_KEY }}
      S3_CWD_SECRET_KEY: ${{ secrets.S3_CWD_SECRET_KEY }}

      AGO_HOST: ${{ secrets.AGO_HOST }}
      AGO_USERNAME: ${{ secrets.AGO_USERNAME }}
      AGO_PASSWORD: ${{ secrets.AGO_PASSWORD }}

      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9.19'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Kerberos build dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            krb5-user \
            libkrb5-dev

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Update Dropoff Locations Layer
        run: python cwd_update_dropoff_locations_layer.py
